name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      BASE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_PASSWORD: admin123
      JWT_SECRET: segredo-dev-gestao-de-alunos
      MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar a API
        run: npm start > api.log 2>&1 &

      - name: Aguardar a API
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:3000/ >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ >/dev/null

      - name: Executar testes
        run: npm test
